<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>混合推理 Agent · 路由演示</title>
<style>
  :root {
    --bg: #ffffff;
    --side: #f6f5f2;
    --line: #e6e3dc;
    --line-soft: #efece6;
    --text: #22221f;
    --muted: #86837a;
    --easy: #0f6e56;
    --easy-bg: #e1f5ee;
    --hard: #854f0b;
    --hard-bg: #faeeda;
    --accent: #534ab7;
    --accent-bg: #eeecfa;
    --guard: #a32d2d;
    --guard-bg: #fdeceb;
    --guard-line: #f3c9c6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height: 1.65; font-size: 15px;
  }
  button { font: inherit; cursor: pointer; }

  /* ---------------- 左侧会话栏 ---------------- */
  .side {
    width: 264px; flex: 0 0 264px; background: var(--side);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand { padding: 16px 16px 10px; }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .brand .tag { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .newchat {
    margin: 4px 12px 10px; padding: 9px 12px; border-radius: 10px;
    border: 1px solid #d8d4cb; background: #fff; color: var(--text);
    display: flex; align-items: center; gap: 8px; font-size: 13.5px;
    transition: border-color .15s, box-shadow .15s;
  }
  .newchat:hover { border-color: #b9b3a7; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .newchat .plus { color: var(--accent); font-weight: 600; font-size: 15px; }
  .side-label {
    font-size: 11px; color: var(--muted); padding: 6px 16px 4px;
    display: flex; justify-content: space-between;
  }
  .sess-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; min-height: 0; }
  .sess {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-radius: 9px; cursor: pointer; font-size: 13px;
    color: #3d3b35; border: 1px solid transparent; margin-bottom: 2px;
  }
  .sess:hover { background: #ebe8e1; }
  .sess.active { background: #fff; border-color: #d5d0c6; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .sess .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .del {
    border: 0; background: transparent; color: #b3afa5; font-size: 14px;
    line-height: 1; padding: 1px 4px; border-radius: 5px; opacity: 0;
  }
  .sess:hover .del { opacity: 1; }
  .sess .del:hover { color: var(--guard); background: #f3e5e3; }
  .sess .del.armed { opacity: 1; color: var(--guard); font-size: 11px; width: auto; }
  .side-foot {
    border-top: 1px solid var(--line); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px;
  }
  .side-foot button {
    flex: 1 1 auto; font-size: 12px; padding: 5px 8px; border-radius: 7px;
    border: 1px solid transparent; background: transparent; color: var(--muted);
  }
  .side-foot button:hover { background: #eae7e0; color: var(--text); }
  .side-foot button.danger { color: var(--guard); border-color: var(--guard-line); background: #fff; }

  /* ---------------- 主区 ---------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar {
    height: 54px; flex: 0 0 54px; display: flex; align-items: center; gap: 14px;
    padding: 0 18px; border-bottom: 1px solid var(--line); background: #fff;
  }
  .topbar .title {
    font-size: 14px; font-weight: 500; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1;
  }
  .metrics { display: flex; gap: 14px; flex-wrap: nowrap; overflow: hidden; }
  .metric { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .metric b { color: var(--text); font-weight: 600; margin-left: 3px; }
  .metric.warn b { color: var(--guard); }
  .menu-btn {
    display: none; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; padding: 4px 9px; font-size: 15px; line-height: 1;
  }

  .chat { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
  .stream {
    max-width: 780px; width: 100%; margin: 0 auto; padding: 24px 24px 8px;
    display: flex; flex-direction: column; gap: 16px;
  }

  /* 空状态 */
  .empty { max-width: 640px; width: 100%; margin: auto; padding: 0 24px 6vh; }
  .empty h2 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .empty p { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  .demo-cards { display: grid; gap: 10px; }
  .dcard {
    text-align: left; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 11px; background: #fff; transition: border-color .15s, transform .15s;
  }
  .dcard:hover { border-color: #c3bdd6; transform: translateY(-1px); }
  .dcard .h { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .dcard .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .dcard .q { font-size: 12.5px; color: var(--accent); margin-top: 6px; }

  /* 消息 */
  .msg { display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: #efedf9; color: #2b2740; border-radius: 14px 14px 4px 14px;
    padding: 9px 14px; max-width: 78%; white-space: pre-wrap; word-break: break-word;
    font-size: 14.5px; border: 1px solid #e2ddf4;
  }
  .msg.ai { align-items: stretch; }
  .msg.ai .card {
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.02);
  }
  .ai-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px;
    padding: 2px 9px; border-radius: 999px; font-weight: 600; white-space: nowrap;
  }
  .badge.cache { background: var(--accent-bg); color: var(--accent); }
  .badge.easy { background: var(--easy-bg); color: var(--easy); }
  .badge.hard { background: var(--hard-bg); color: var(--hard); }
  .badge.guard { background: var(--guard-bg); color: var(--guard); border: 1px solid var(--guard-line); }
  .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .meta b { color: #4a4842; font-weight: 600; }
  .answer { white-space: pre-wrap; word-break: break-word; font-size: 14.5px; }
  .answer b { font-weight: 600; }
  .answer code.ic {
    background: #f4f2ec; border: 1px solid var(--line); border-radius: 4px;
    padding: 0 4px; font-size: 12.5px; font-family: ui-monospace, Consolas, monospace;
  }
  .answer.pending { color: var(--muted); }

  /* 门卫拦截：整个演示里最该被看见的一块 */
  .guard-box {
    margin: 10px 0 2px; padding: 10px 12px; border-radius: 10px;
    background: var(--guard-bg); border: 1px solid var(--guard-line);
    font-size: 12.5px; color: #7d2222; line-height: 1.6;
  }
  .guard-box .gh {
    font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
  }
  .guard-box code {
    background: #fff; border: 1px solid #f0d6d3; border-radius: 5px;
    padding: 0 4px; font-size: 11.5px; color: #9b2c2c;
  }
  .guard-box .q { color: #9b5a5a; font-size: 11.5px; margin-top: 4px; }

  /* 工具调用：这一轮它真的动了手，过程要能一层层展开看 */
  .toolbox {
    margin: 10px 0 2px; border: 1px solid #d5e7e0; border-radius: 10px;
    background: #f6fbf9; overflow: hidden;
  }
  .toolbox > summary {
    display: flex; gap: 8px; align-items: center; cursor: pointer;
    padding: 6px 10px; background: #eaf6f2; font-size: 12px; color: #0f6e56;
    list-style: none; user-select: none;
  }
  .toolbox > summary::-webkit-details-marker { display: none; }
  .toolbox > summary .why { margin-left: auto; color: #86837a; font-weight: 400; }
  .tstep {
    display: flex; gap: 8px; align-items: baseline; padding: 5px 10px;
    font-size: 12px; border-top: 1px solid #e2efe9;
  }
  .tstep .n { color: #a8b3ae; flex: 0 0 12px; }
  .tstep .nm { font-family: ui-monospace, Consolas, monospace; font-weight: 600; color: #22221f; }
  .tstep .ar {
    flex: 1; min-width: 0; color: #86837a; font-size: 11.5px;
    font-family: ui-monospace, Consolas, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tstep .st { color: #0f6e56; white-space: nowrap; font-size: 11.5px; }
  .tstep.fail .st { color: var(--guard); }
  .tstep.rep .st { color: #9b978d; }
  /* 这一步是人点头才跑的 / 被人拒掉的：轨迹上必须一眼能分出来 */
  .tstep .cf {
    font-size: 10.5px; padding: 0 5px; border-radius: 999px; white-space: nowrap;
    border: 1px solid #bfe3d6; background: #e9f7f1; color: #0f6e56;
  }
  .tstep .cf.rej { border-color: var(--guard-line); background: var(--guard-bg); color: var(--guard); }

  /* 多智能体：审查员说的话，要跟工具轨迹分开显示——它是"另一个角色"的意见 */
  .critbox {
    margin: 10px 0 2px; border: 1px solid #d9dff0; border-radius: 10px;
    background: #f6f7fc; overflow: hidden;
  }
  .critbox > summary {
    display: flex; gap: 8px; align-items: center; cursor: pointer;
    padding: 6px 10px; background: #eceffa; font-size: 12px; color: #4a5b96;
    list-style: none; user-select: none;
  }
  .critbox > summary::-webkit-details-marker { display: none; }
  .critbox > summary .why { margin-left: auto; color: #86837a; font-weight: 400; }
  .critbox .cissue {
    padding: 5px 10px; font-size: 12px; border-top: 1px solid #e4e8f5;
    color: #3d4463; display: flex; gap: 6px;
  }
  .critbox .cissue .dot { color: #8b93b8; }
  .critbox.bad > summary { background: var(--guard-bg); color: var(--guard); border-color: var(--guard-line); }
  .critbox.bad { border-color: var(--guard-line); background: #fdf6f4; }

  /* 人在环路：动手之前拦一道，问一句 */
  .askbox {
    margin: 10px 0 2px; padding: 12px; border-radius: 12px;
    background: #fffaef; border: 1px solid #f0dfb8;
  }
  .askbox .ah {
    display: flex; align-items: center; gap: 6px; font-weight: 700;
    font-size: 13px; color: #7a5310; margin-bottom: 6px;
  }
  .askbox .acall {
    font-size: 12px; background: #fff; border: 1px solid #f0e4c9; border-radius: 8px;
    padding: 7px 9px; margin-bottom: 6px;
  }
  .askbox .acall .nm {
    font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: #22221f;
  }
  .askbox .acall .ar {
    font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
    color: #86837a; word-break: break-all; margin-top: 2px;
  }
  .askbox .why2 { color: #9a7a3a; font-size: 11.5px; }
  .askbox .acts { display: flex; gap: 8px; margin-top: 8px; }
  .askbox button {
    border-radius: 8px; padding: 6px 14px; font-size: 13px; border: 1px solid var(--line);
    background: #fff; color: var(--text);
  }
  .askbox button.ok { background: var(--easy); border-color: var(--easy); color: #fff; }
  .askbox button.no:hover { border-color: var(--guard-line); color: var(--guard); }
  .askbox .hint2 { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  .detail { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .detail summary {
    cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; user-select: none;
  }
  .detail summary::-webkit-details-marker { display: none; }
  .detail summary::before { content: "› "; }
  .detail[open] summary::before { content: "⌄ "; }
  .detail .body { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .rag-item { padding: 4px 0 4px 9px; border-left: 2px solid var(--line); margin-bottom: 4px; }
  .rag-item .src { color: var(--accent); }
  .rag-item b { color: var(--text); font-weight: 500; }

  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: #bdb8ad;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  /* 输入区 */
  .composer { border-top: 1px solid var(--line); background: #fff; padding: 10px 0 14px; }
  .composer-inner { max-width: 780px; margin: 0 auto; padding: 0 24px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: #5d5a52;
  }
  .chip:hover { border-color: #c3bdd6; color: var(--accent); }
  .box {
    display: flex; align-items: flex-end; gap: 8px; border: 1px solid #d8d4cb;
    border-radius: 14px; padding: 8px 8px 8px 12px; background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .box:focus-within { border-color: #b7aee8; box-shadow: 0 0 0 3px rgba(83,74,183,.08); }
  textarea {
    flex: 1; border: 0; outline: none; resize: none; font: inherit; font-size: 14.5px;
    line-height: 1.6; max-height: 148px; min-height: 26px; padding: 4px 0;
    background: transparent; color: var(--text);
  }
  .send {
    border: 0; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 7px 16px; font-size: 13.5px; font-weight: 500; flex: 0 0 auto;
  }
  .send:disabled { opacity: .45; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; min-height: 16px; }
  .hint .err { color: var(--guard); }

  /* 统计抽屉 */
  .scrim {
    position: fixed; inset: 0; background: rgba(30,28,24,.28); opacity: 0;
    pointer-events: none; transition: opacity .18s; z-index: 20;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 400px; max-width: 92vw;
    background: #fff; border-left: 1px solid var(--line); z-index: 21;
    transform: translateX(100%); transition: transform .22s ease;
    display: flex; flex-direction: column;
  }
  .drawer.on { transform: none; }
  .drawer-head {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-head b { font-size: 14px; font-weight: 600; }
  .drawer-body { padding: 16px 18px 40px; overflow-y: auto; }
  .sec-t { font-size: 11px; color: var(--muted); letter-spacing: .4px; margin: 18px 0 8px; }
  .sec-t:first-child { margin-top: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kv { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
  .kv .k { font-size: 11px; color: var(--muted); }
  .kv .v { font-size: 15px; font-weight: 600; margin-top: 1px; }
  .kv .v small { font-size: 11px; font-weight: 400; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line-soft); }
  th { color: var(--muted); font-weight: 500; }
  td .gd { color: var(--guard); }
  .note {
    font-size: 11.5px; color: var(--hard); background: var(--hard-bg);
    border: 1px solid #eddcc0; border-radius: 8px; padding: 8px 10px; margin-bottom: 12px;
  }
  .hidden { display: none !important; }

  @media (max-width: 860px) {
    .side {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 30;
      transform: translateX(-100%); transition: transform .22s;
    }
    .side.on { transform: none; }
    .menu-btn { display: block; }
    .metrics { display: none; }
    .stream, .composer-inner { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<aside class="side" id="side">
  <div class="brand">
    <h1>混合推理 Agent</h1>
    <div class="tag">路由 · 语义缓存 · 检索</div>
  </div>
  <button class="newchat" id="new-chat"><span class="plus">＋</span> 新对话</button>
  <div class="side-label"><span>我的对话</span><span id="sess-count"></span></div>
  <div class="sess-list" id="sessions"></div>
  <div class="side-foot">
    <button id="open-stats">统计</button>
    <button id="forget">忘掉我</button>
    <button id="clear-sessions">清空对话</button>
    <button id="clear-stats">清空统计</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="menu-btn" id="menu">≡</button>
    <div class="title" id="sess-title">新对话</div>
    <div class="metrics" id="metrics">
      <span class="metric">轮次<b id="m-turns">0</b></span>
      <span class="metric">成本<b id="m-cost">¥0</b></span>
      <span class="metric">节省<b id="m-saved">—</b></span>
      <span class="metric">命中<b id="m-hit">0</b></span>
      <span class="metric warn">门卫拦截<b id="m-guard">0</b></span>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="stream" id="stream"></div>
    <div class="empty" id="empty">
      <h2>问点什么，看它怎么省钱</h2>
      <p>同一个问题问两遍会走缓存（¥0）；差一个字的另一个问题会被"门卫"拦下，不敢复用。</p>
      <div class="demo-cards">
        <button class="dcard" data-demo="cache">
          <div class="h">① 缓存命中演示</div>
          <div class="d">连续问两次同一个问题，第二次走缓存，成本归零。</div>
          <div class="q">把 3 点 15 分转换成 24 小时制的数字写法</div>
        </button>
        <button class="dcard" data-demo="guard">
          <div class="h">② 门卫拦截演示</div>
          <div class="d">和第 ① 步只差一个数字。相似度 0.9+，但答案完全不同，必须拒绝复用。</div>
          <div class="q">把 3 点 45 分转换成 24 小时制的数字写法</div>
        </button>
        <button class="dcard" data-demo="ask">
          <div class="h">③ 随便问个复杂的</div>
          <div class="d">看它判定难度、决定走本地还是云端，并把每一笔花销记下来。</div>
          <div class="q">用 Python 写一个带超时控制的进程池，并解释为什么用 deque 而不是 list 做任务队列</div>
        </button>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <div class="chips">
        <button class="chip" data-q="你好，你是谁？">闲聊</button>
        <button class="chip" data-q="把「会议推迟到周四下午三点」翻译成英文">翻译</button>
        <button class="chip" data-q="熔断器的三个状态是什么？">查资料</button>
        <button class="chip" data-q="什么是语义缓存？">概念</button>
      </div>
      <div class="box">
        <textarea id="q" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send" id="send">发送</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <b>运行数据</b>
    <button class="chip" id="close-drawer">关闭</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const money = (n, d = 6) => {
  const v = Number(n || 0);
  if (!v) return '¥0';
  if (v >= 0.01) return '¥' + v.toFixed(4);
  return '¥' + v.toFixed(d);
};


// 预览面板里看不到控制台，脚本一报错就"点了没反应"。把错误显示在页面上。
window.addEventListener('error', (e) => {
  const h = $('hint');
  if (h) h.innerHTML = '<span class="err">页面脚本错误：' + esc(e.message || e.error) + '</span>';
});

// ---------------- 本地状态 ----------------
const SID_KEY = 'hybrid_agent_sid';     // 当前会话
const SIDS_KEY = 'hybrid_agent_sids';   // 这台浏览器创建过的会话（只显示自己的）
const UID_KEY = 'hybrid_agent_uid';     // 长期记忆身份，跨会话不变

function newSid() {
  const raw = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : String(Date.now()) + Math.random().toString(16).slice(2);
  return raw.replace(/-/g, '').slice(0, 12);
}

let mySids = [];
try { mySids = JSON.parse(localStorage.getItem(SIDS_KEY) || '[]'); } catch (e) { mySids = []; }
if (!Array.isArray(mySids)) mySids = [];

let sessionId = localStorage.getItem(SID_KEY) || newSid();
// ?s=<会话id> 直接打开某个对话：方便把"我在哪个对话里演示的"整段链接发出去，
// 也方便面试时提前把两条对照问题摆好，点开就是现场。
const urlSid = new URLSearchParams(location.search).get('s');
if (urlSid) sessionId = urlSid.slice(0, 64);
if (!mySids.includes(sessionId)) mySids.unshift(sessionId);
localStorage.setItem(SID_KEY, sessionId);
localStorage.setItem(SIDS_KEY, JSON.stringify(mySids));

let userId = localStorage.getItem(UID_KEY) || ('user-' + newSid());
localStorage.setItem(UID_KEY, userId);

// 后端 /api/sessions 是全站会话（含别人的）。本地只认自己创建过的那些 id，
// 这样左侧列表就只有"我的对话"——既不会串台，也不会看到陌生人的提问。
let serverSessions = new Map();   // sid -> {title, turns, updated_at, updated_ts}
let busy = false;

// ---------------- 渲染：会话列表 ----------------
function sessionTitle(sid) {
  const s = serverSessions.get(sid);
  return s && s.title ? s.title : '新对话';
}

function renderSidebar() {
  const items = mySids.map((sid) => ({ sid, ...(serverSessions.get(sid) || {}) }));
  items.sort((a, b) => (b.updated_ts || 0) - (a.updated_ts || 0));
  $('sess-count').textContent = items.length ? items.length + ' 个' : '';
  if (!items.length) {
    $('sessions').innerHTML = '<div style="padding:10px 10px;font-size:12px;color:#9b978d">还没有对话</div>';
    return;
  }
  $('sessions').innerHTML = items.map((it) => `
    <div class="sess ${it.sid === sessionId ? 'active' : ''}" data-sid="${esc(it.sid)}">
      <span class="t">${esc(sessionTitle(it.sid))}</span>
      <button class="del" data-del="${esc(it.sid)}" title="删除这个对话">×</button>
    </div>`).join('');
  $('sessions').querySelectorAll('.sess').forEach((el) => {
    el.onclick = () => switchSession(el.dataset.sid);
  });
  $('sessions').querySelectorAll('.del').forEach((btn) => {
    btn.onclick = (e) => { e.stopPropagation(); armDelete(btn.dataset.del, btn); };
  });
}

async function loadSessions() {
  try {
    const r = await fetch('/api/sessions?limit=50');
    const d = await r.json();
    const m = new Map();
    (d.sessions || []).forEach((s) => m.set(s.session_id, s));
    serverSessions = m;
  } catch (e) { /* 列表拉不到不影响聊天 */ }
  renderSidebar();
}

// ---------------- 渲染：对话流 ----------------
const LAYER_LABEL = {
  cache: ['语义缓存命中', 'cache'],
  local: ['本地小模型', 'easy'],
  cloud: ['云端大模型', 'hard'],
};

function layerOf(meta) {
  // 历史记录只有 decided_by / model，没有现成的 layer：按同样口径反推。
  // 和 server._layer_of 保持一致，否则历史消息和实时消息的徽章会不一样。
  if (!meta) return 'cloud';
  if (meta.decided_by === 'cache') return 'cache';
  const model = String(meta.model || '');
  if (meta.layer) return meta.layer;
  if (window.__localModel && model.startsWith(window.__localModel)) return 'local';
  return 'cloud';
}

function badgeHtml(meta) {
  if (!meta) return '';
  const [label, cls] = LAYER_LABEL[layerOf(meta)] || LAYER_LABEL.cloud;
  let html = `<span class="badge ${cls}">${label}</span>`;
  if (meta.guard_blocked) {
    html += `<span class="badge guard">门卫拦截</span>`;
  }
  return html;
}

function metaLine(meta) {
  if (!meta) return '';
  const parts = [];
  parts.push(`耗时 <b>${meta.latency_ms || 0}ms</b>`);
  parts.push(`成本 <b>${money(meta.cost_cny)}</b>`);
  const base = Number(meta.baseline_cost_cny || 0);
  const cost = Number(meta.cost_cny || 0);
  if (base > 0) parts.push(`全云端 <b>${money(base)}</b>`);
  if (base > 0) {
    const saved = Math.max(0, Math.round((1 - cost / base) * 100));
    parts.push(`省 <b>${saved}%</b>`);
  }
  // 相似度：命中时说明"凭什么复用"，被拦时说明"凭什么不敢复用"
  const sc = Number(meta.hit_score || 0);
  if (sc > 0) parts.push(`相似度 <b>${sc.toFixed(3)}</b>`);
  if (meta.tools && meta.tools.used) parts.push(`工具 <b>${meta.tools.calls || 0} 次</b>`);
  const cf = meta.tools && meta.tools.confirm;
  if (cf && cf.asked) parts.push(`你确认 <b>${cf.asked}</b> 次`);
  const waited = Number((meta.tools && meta.tools.waited_ms) || 0);
  if (waited > 500) parts.push(`其中等你 <b>${(waited / 1000).toFixed(1)}s</b>`);
  // 审查：把"多花的钱买到了什么"直接写在成本旁边，不用点开也看得见
  const cr = meta.critic;
  if (cr && cr.rounds) {
    parts.push(`审查 <b>${cr.score} 分</b>${cr.fixes ? ` · 返工 <b>${cr.fixes}</b> 次` : ''}`);
  }
  return `<div class="meta">${parts.join('<span style="color:#ddd9d0">·</span>')}</div>`;
}

const STOP_LABEL = {
  '': '',
  answer: '',
  max_steps: '到步数上限',
  budget: '到预算上限',
  no_progress: '在打转，提前收口',
  error: '链路出错，已降级',
  cancelled: '你放弃了这一步',
};

// 这一步谁放的：自己跑的、你点头的、你拒掉的。三种含义完全不同，不能都叫"调用了"。
const CF_LABEL = { approved: '你同意了', rejected: '你拒绝了' };

// 工具调用轨迹。为什么不合并进 metaLine 一行字：
// "调了 3 次工具" 这句话本身没有信息量，能证明它会动手的是**每一步的参数和结果**。
// 所以默认展开，小屏也能一眼看到"它去查了哪张表、跑了什么代码"。
function toolBox(tools) {
  if (!tools || !tools.used) return '';
  const steps = tools.steps || [];
  const rows = steps.map((s) => {
    const cf = CF_LABEL[s.confirm]
      ? `<span class="cf ${s.confirm === 'rejected' ? 'rej' : ''}">${CF_LABEL[s.confirm]}</span>` : '';
    return `
    <div class="tstep ${s.ok ? '' : 'fail'} ${s.repeat ? 'rep' : ''}">
      <span class="n">${esc(String(s.n || ''))}</span>
      <span class="nm">${esc(s.name || '')}</span>
      ${cf}
      <span class="ar" title="${esc(s.args || '')}">${esc(s.args || '')}</span>
      <span class="st">${s.repeat ? '重复·跳过'
        : (s.ok ? (esc(s.summary || '完成') + (s.ms ? ' · ' + s.ms + 'ms' : ''))
                : esc(s.error || s.summary || '失败'))}</span>
    </div>`;
  }).join('');
  const cf = tools.confirm || {};
  const cfText = cf.asked ? `人确认 ${cf.approved} 批 / ${cf.rejected} 拒` : '';
  return `
    <details class="toolbox" open>
      <summary>
        <b>工具调用 · ${tools.calls || 0} 次</b>
        <span>${esc(STOP_LABEL[tools.stop] || '')}</span>
        <span>${esc(cfText)}</span>
        <span class="why">${tools.reason ? '因为' + esc(tools.reason) : ''}</span>
      </summary>
      ${rows}
    </details>`;
}

// 审查员的话。为什么不并进工具框：它是**另一个角色**的判断，不是"这一步做了什么"。
// 合并显示会让"谁说的"消失——而多智能体演示的全部看点就是"有第二个人在挑错"。
function criticBox(c) {
  if (!c || c.skipped || !c.rounds) return '';
  const issues = c.issues || [];
  const bad = !c.pass;
  const head = bad
    ? `审查员 · <b>${c.score} 分</b> · 提了 ${issues.length} 个问题`
    : `审查员 · <b>${c.score} 分</b> · 通过`;
  const rounds = `${c.rounds} 轮${c.fixes ? ' · 返工 ' + c.fixes + ' 次' : ''}`;
  return `
    <details class="critbox ${bad ? 'bad' : ''}" ${bad ? 'open' : ''}>
      <summary>
        <span>${head}</span>
        <span>${esc(rounds)}</span>
        <span class="why">${c.by === 'rule' ? '数字核对直接判的（零成本）'
          : c.by === 'error' ? '审查员自己出错，已放行' : ''}</span>
      </summary>
      ${issues.map((x) => `<div class="cissue"><span class="dot">·</span>${esc(x)}</div>`).join('')
        || `<div class="cissue"><span class="dot">·</span>没有发现问题</div>`}
    </details>`;
}

// 确认卡：动手之前的最后一道闸。这里显示的不是"它将要做的事"的概括，
// 而是**原样的工具名和参数**——让人凭一眼就能判断该不该批。
function confirmBox(pending) {
  const p = pending || {};
  const calls = (p.calls || []).map((c) => `
    <div class="acall">
      <span class="nm">${esc(c.name || '')}</span>
      <span class="why2"> · ${esc(c.level || '')} 级 · ${esc(c.why || '')}</span>
      <div class="ar">${esc(JSON.stringify(c.args || {}))}</div>
    </div>`).join('');
  return `<div class="askbox">
    <div class="ah">⚠ 这一步要你点头</div>
    <div style="font-size:12.5px;color:#7a5310;margin-bottom:8px">${esc(p.question || '')}</div>
    ${calls}
    <div class="acts">
      <button class="ok" onclick="__answerConfirm(true)">同意执行</button>
      <button class="no" onclick="__answerConfirm(false)">拒绝</button>
    </div>
    <div class="hint2">${esc(p.reject_hint || '')}</div>
  </div>`;
}

function guardBox(meta) {
  if (!meta || !meta.guard_blocked) return '';
  const sc = Number(meta.hit_score || 0);
  const score = sc > 0 ? sc.toFixed(3) : '未知';
  const thr = (window.__cacheCfg && window.__cacheCfg.threshold) || null;
  const thrText = thr ? `比 <code>${Number(thr).toFixed(2)}</code> 的复用线还高` : '已超过复用线';
  return `
    <div class="guard-box">
      <div class="gh">门卫拦截 · 这一轮拒绝复用缓存</div>
      有一条缓存候选，相似度 <code>${score}</code> ${thrText}，
      但守卫发现 <code>${esc(meta.guard_blocked)}</code>——
      这一问的答案会不一样，复用就是给你别人的答案。已改走模型重新作答。
      ${meta.guard_matched ? `<div class="q">差点被复用的原问题：${esc(meta.guard_matched)}</div>` : ''}
    </div>`;
}

// 后端历史消息只有 role/content，元信息在记账表里按顺序对。用 query 文本核对，
// 对不上就不挂元信息 —— 宁可少显示，也不要把 A 轮的耗时贴到 B 轮上。
function buildStream(messages, turns) {
  const out = [];
  let ti = 0;
  for (const m of messages) {
    const role = m.role === 'user' ? 'user' : 'ai';
    if (role === 'user') {
      out.push({ role, content: m.content, meta: null });
      continue;
    }
    let meta = null;
    const t = turns[ti];
    if (t) {
      const prevUser = [...out].reverse().find((x) => x.role === 'user');
      const same = prevUser && (t.query || '').slice(0, 24) === (prevUser.content || '').slice(0, 24);
      if (!prevUser || same) {
        const steps = Array.isArray(t.tool_steps) ? t.tool_steps : [];
        meta = {
          ...t,
          hit_score: t.cache_score,
          tools: {
            used: steps.length > 0,
            calls: steps.filter((x) => !x.repeat).length,
            steps,
            stop: '',
            reason: '',
          },
          // 刷新页面后审查痕迹也要在：记账表里存的是分号串，这里还原成数组。
          // skipped 用 rounds===0 反推——旧数据没有这一列，缺省当成"没审"最安全。
          critic: {
            rounds: t.critic_rounds || 0,
            pass: !!t.critic_pass,
            score: t.critic_score || 0,
            fixes: t.critic_fixes || 0,
            issues: String(t.critic_issues || '').split('；').filter(Boolean),
            skipped: !(t.critic_rounds > 0),
            by: '',
          },
        };
      }
    }
    out.push({ role, content: m.content, meta });
    if (t) ti++;
  }
  return out;
}

// 只渲染两种行内格式：**加粗** 和 `行内代码`。模型爱输出 markdown，直接当纯文本
// 会把星号照抄给用户。先 esc 再做替换，所以不存在把用户内容当 HTML 执行的路径——
// 这一步的顺序不能反，反了就是 XSS。
function mdInline(text) {
  let h = esc(text || '');
  h = h.replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  return h;
}

function nodeHtml(item) {
  if (item.role === 'user') {
    return `<div class="msg user"><div class="bubble">${esc(item.content)}</div></div>`;
  }
  const m = item.meta;
  return `
    <div class="msg ai"><div class="card">
      <div class="ai-head">${item.ask ? '<span class="badge hard">等你确认</span>' : badgeHtml(m)}</div>
      ${toolBox(m && m.tools)}
      ${criticBox(m && m.critic)}
      ${item.content ? `<div class="answer">${mdInline(item.content)}</div>` : ''}
      ${guardBox(m)}
      ${metaLine(m)}
      ${item.extra || ''}
    </div></div>`;
}

function paint(items) {
  $('empty').classList.toggle('hidden', items.length > 0);
  $('stream').innerHTML = items.map(nodeHtml).join('');
  scrollBottom();
}

function scrollBottom() {
  const c = $('chat');
  c.scrollTop = c.scrollHeight;
}

let currentItems = [];
let currentTurns = [];

async function loadCurrent() {
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(sessionId));
    const d = await r.json();
    currentTurns = d.turns || [];
    currentItems = buildStream(d.messages || [], currentTurns);
    // 挂起中的确认：刷新页面后卡要能自己回来。不恢复的话，图还在等你点，
    // 页面上却空了——用户只能开新会话，那一轮的钱就白花了。
    if (d.pending) {
      // 这一轮还没跑完，历史里没有它的记录——问题原文要从 pending 里补回来
      const last = currentItems[currentItems.length - 1];
      if (d.pending.query && !(last && last.role === 'user' && last.content === d.pending.query)) {
        currentItems.push({ role: 'user', content: d.pending.query, meta: null });
      }
      currentItems.push({ role: 'ai', content: '', meta: null, ask: true,
                          extra: confirmBox(d.pending) });
    }
    paint(currentItems);
    updateMetrics(currentTurns);
    const first = (d.messages || []).find((m) => m.role === 'user');
    $('sess-title').textContent = first ? first.content.slice(0, 40) : '新对话';
  } catch (e) {
    currentItems = [];
    currentTurns = [];
    paint([]);
    updateMetrics([]);
    $('sess-title').textContent = '新对话';
  }
}

// 顶部这套数字只算「当前这个对话」，全站累计放在统计抽屉里。
// 混在一起会出现"我就问了 2 句，怎么显示 80 次请求"的困惑。
function updateMetrics(turns) {
  const n = turns.length;
  let cost = 0, base = 0, hits = 0, guards = 0;
  for (const t of turns) {
    cost += Number(t.cost_cny || 0);
    base += Number(t.baseline_cost_cny || 0);
    if (t.decided_by === 'cache') hits++;
    if (t.guard_blocked) guards++;
  }
  $('m-turns').textContent = n;
  $('m-cost').textContent = money(cost, 4);
  $('m-saved').textContent = base > 0 ? Math.max(0, Math.round((1 - cost / base) * 100)) + '%' : '—';
  $('m-hit').textContent = hits;
  $('m-guard').textContent = guards;
}

// ---------------- 发消息 ----------------
function autoGrow() {
  const t = $('q');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 148) + 'px';
}
$('q').addEventListener('input', autoGrow);

function setHint(text, isErr) {
  $('hint').innerHTML = text ? (isErr ? `<span class="err">${esc(text)}</span>` : esc(text)) : '';
}

// 把这一轮的元信息换成和记账表同样的字段形状，好让顶栏指标能直接用同一套算法累加。
// 不重新拉接口是为了不打断正在滚动的对话。
function turnsRowOf(meta, query) {
  return {
    query,
    decided_by: meta.decided_by,
    route: meta.layer === 'local' ? 'easy' : 'hard',
    latency_ms: meta.latency_ms,
    cost_cny: meta.cost_cny,
    baseline_cost_cny: meta.baseline_cost_cny,
    guard_blocked: meta.guard_blocked,
  };
}

// 把一次成功的结果画进对话流。抽成函数是因为有两条路会走到这里：
// 普通提问（/api/chat 直接给答案）和点了确认之后继续跑（/api/confirm）。
// 复制一份渲染代码的下场是两边慢慢长歪——一边加了工具卡一边没加。
function applyResult(d, query, items) {
  const meta = {
    decided_by: d.decided_by,
    model: d.model,
    layer: d.layer,
    latency_ms: d.latency_ms,
    cost_cny: d.cost_cny,
    baseline_cost_cny: d.baseline_cost_cny,
    guard_blocked: (d.cache_guard && d.cache_guard.blocked) ? d.cache_guard.reason : '',
    guard_matched: d.cache_guard ? d.cache_guard.matched : '',
    hit_score: (d.cache_hit ? d.cache_score : (d.cache_guard ? d.cache_guard.score : null)),
    tools: d.tools || null,
    critic: d.critic || null,
  };

  // 检索来源：答案不是编的唯一证据，所以要让出处可见
  let extra = '';
  const rg = d.rag || {};
  if (rg.hit && rg.chunks && rg.chunks.length) {
    extra = `<details class="detail"><summary>参考了 ${rg.chunks.length} 段资料（检索 ${rg.latency_ms || 0}ms）</summary>
      <div class="body">${rg.chunks.map((c) => `
        <div class="rag-item"><span class="src">${esc(c.doc)}${c.heading ? ' § ' + esc(c.heading) : ''}</span>
        <b> 相关度 ${esc(c.score)}</b></div>`).join('')}</div></details>`;
  }
  const mem = d.memory || {};
  const memBits = [];
  if (mem.facts_injected && mem.facts_injected.length) memBits.push('注入记忆：' + mem.facts_injected.join('、'));
  if (mem.facts_saved && mem.facts_saved.length) memBits.push('新记住：' + mem.facts_saved.join('、'));
  if (mem.summary_used) memBits.push('使用了早前对话的摘要');
  if (memBits.length) {
    extra += `<details class="detail"><summary>上下文做了什么</summary>
      <div class="body">${esc(memBits.join('；'))}</div></details>`;
  }

  items.push({ role: 'ai', content: d.answer || '（空回答）', meta, extra });
  currentItems = items;
  currentTurns = currentTurns.concat([turnsRowOf(meta, query)]);
  paint(items);
  updateMetrics(currentTurns);
  $('sess-title').textContent = (currentItems.find((x) => x.role === 'user') || {}).content.slice(0, 40) || '新对话';

  if (meta.guard_blocked) {
    setHint('这一轮被门卫拦下了：差点复用一条别的答案，已重新作答');
  } else if (d.cache_hit) {
    setHint('命中语义缓存：没有调用模型，这一轮成本为 0');
  } else {
    setHint('');
  }
  setTimeout(() => { if (!$('hint').textContent.startsWith('请求失败')) setHint(''); }, 4200);

  loadSessions();
  refreshGlobal();
}

async function send() {
  const query = $('q').value.trim();
  if (!query || busy) return;
  busy = true;
  $('send').disabled = true;
  $('q').value = '';
  autoGrow();
  setHint('推理中…');

  // 先把用户这句和"正在思考"占位画上去：答案就出现在提问的正下方，
  // 不用等整页刷新、也不会掉到页面最底部去。
  const items = currentItems.slice();
  items.push({ role: 'user', content: query, meta: null });
  items.push({ role: 'ai', content: '', meta: null, extra: '', pending: true });
  paintPending(items);

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, session_id: sessionId, user_id: userId }),
    });
    const d = await r.json();
    if (d.error) {
      items.pop();
      items.push({ role: 'ai', content: '（这一轮没拿到答案）' + d.error, meta: null });
      paint(items);
      currentItems = items;
      setHint(d.error, true);
      return;
    }

    // 它想动手，但这个动作会改数据 → 停下来问人。
    // 注意这一轮**还没有答案**，也没有记账：真正的答案在点了确认之后才产生。
    if (d.status === 'awaiting_confirm') {
      items.pop();
      items.push({ role: 'ai', content: '', meta: null, ask: true,
                   extra: confirmBox(d.pending) });
      currentItems = items;
      paint(items);
      setHint('等你点头：这一步会改动数据，批了才执行');
      return;
    }

    items.pop();
    applyResult(d, query, items);
  } catch (e) {
    items.pop();
    items.push({ role: 'ai', content: '（请求失败）' + e, meta: null });
    currentItems = items;
    paint(items);
    setHint('请求失败：' + e, true);
  } finally {
    busy = false;
    $('send').disabled = false;
    $('q').focus();
  }
}

// 确认卡上的两个按钮。为什么要单独一个接口：上一轮的运行停在检查点里等人，
// 点"同意"不是问一个新问题，而是**把那一轮接着跑完**，语义完全不一样。
window.__answerConfirm = async (approve) => {
  if (busy) return;
  busy = true;
  document.querySelectorAll('.askbox button').forEach((b) => { b.disabled = true; });
  setHint(approve ? '已同意，继续执行…' : '已拒绝，让它换个做法…');
  try {
    const r = await fetch('/api/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, approve }),
    });
    const d = await r.json();
    if (d.error) {
      setHint(d.error, true);
      document.querySelectorAll('.askbox button').forEach((b) => { b.disabled = false; });
      return;
    }
    const items = currentItems.slice();
    let idx = -1;
    items.forEach((x, i) => { if (x.ask) idx = i; });
    const query = idx > 0 ? (items[idx - 1].content || '') : '';
    if (idx >= 0) items.splice(idx, 1);

    if (d.status === 'awaiting_confirm') {
      items.push({ role: 'ai', content: '', meta: null, ask: true,
                   extra: confirmBox(d.pending) });
      currentItems = items;
      paint(items);
      setHint('还有一步要你点头');
      return;
    }
    applyResult(d, query, items);
  } catch (e) {
    setHint('确认失败：' + e, true);
  } finally {
    busy = false;
    $('send').disabled = false;
  }
};

function paintPending(items) {
  $('empty').classList.add('hidden');
  $('stream').innerHTML = items.map((it) => {
    if (it.pending) {
      return `<div class="msg ai"><div class="card">
        <div class="ai-head"><span class="badge hard">思考中</span></div>
        <div class="typing"><i></i><i></i><i></i></div>
      </div></div>`;
    }
    return nodeHtml(it);
  }).join('');
  scrollBottom();
}

// ---------------- 会话切换 / 新建 / 删除 ----------------
async function switchSession(sid) {
  if (!sid || sid === sessionId) { closeSide(); return; }
  sessionId = sid;
  localStorage.setItem(SID_KEY, sid);
  renderSidebar();
  await loadCurrent();
  closeSide();
}

function startNewSession() {
  sessionId = newSid();
  localStorage.setItem(SID_KEY, sessionId);
  // 连点"新对话"会攒出一串没说过话的空壳：只保留"服务端真有记录"的和当前这个。
  // 判据用 serverSessions（checkpointer 里有没有这个 thread），不用时间戳猜。
  const kept = mySids.filter((s) => s === sessionId || serverSessions.has(s));
  mySids = [sessionId, ...kept.filter((s) => s !== sessionId)];
  localStorage.setItem(SIDS_KEY, JSON.stringify(mySids));
  currentItems = [];
  paint([]);
  updateMetrics([]);
  $('sess-title').textContent = '新对话';
  renderSidebar();
  $('q').focus();
  closeSide();
}

$('new-chat').onclick = startNewSession;

let armedDel = null, armedDelTimer = null;
function armDelete(sid, btn) {
  if (armedDel !== sid) {
    armedDel = sid;
    btn.textContent = '确认删除';
    btn.classList.add('armed');
    clearTimeout(armedDelTimer);
    armedDelTimer = setTimeout(() => {
      armedDel = null; btn.textContent = '×'; btn.classList.remove('armed');
    }, 3000);
    return;
  }
  clearTimeout(armedDelTimer);
  armedDel = null;
  removeSession(sid);
}

async function removeSession(sid) {
  try { await fetch('/api/sessions/' + encodeURIComponent(sid), { method: 'DELETE' }); } catch (e) {}
  mySids = mySids.filter((x) => x !== sid);
  localStorage.setItem(SIDS_KEY, JSON.stringify(mySids));
  if (sid === sessionId) {
    // 删的是当前对话：直接开一个新的，别停在空壳上
    currentItems = [];
    paint([]);
    updateMetrics([]);
    $('sess-title').textContent = '新对话';
    setHint('已删除这个对话');
  }
  loadSessions();
}

// ---------------- 统计抽屉 ----------------
async function refreshGlobal() {
  try {
    // 两个接口一起取：/api/stats 是"跑了多少"，/api/cache 是"缓存怎么配的"。
    // 拆开是后端的分工，页面没必要跟着分两次等待。
    const [stats, cfg, tl] = await Promise.all([
      fetch('/api/stats?session_id=' + encodeURIComponent(sessionId) + '&recent_limit=40').then((r) => r.json()),
      fetch('/api/cache').then((r) => r.json()).catch(() => null),
      fetch('/api/tools').then((r) => r.json()).catch(() => null),
    ]);
    window.__stats = stats;
    window.__cacheCfg = cfg;
    window.__tools = tl;
    if (stats.local_model) window.__localModel = stats.local_model;
    renderDrawer(stats);
  } catch (e) { /* 统计失败不影响聊天 */ }
}

function kv(k, v, sub) {
  return `<div class="kv"><div class="k">${k}</div><div class="v">${v}${sub ? `<small> ${sub}</small>` : ''}</div></div>`;
}

function breakerText(b) {
  if (!b) return '—';
  if (b.disabled) return '未启用（纯云）';
  if (b.open) return `已短路 ${b.cooldown_left_s}s`;
  return '正常';
}

function renderDrawer(d) {
  const s = d.summary || {};
  const c = window.__cacheCfg || {};   // 阈值、后端、守卫开关都在这儿
  const kb = d.kb || {};
  const q = d.quota;
  const recent = d.recent || [];
  const saved = Math.round((s.saved_ratio || 0) * 1000) / 10;
  let notes = [];
  if (d.local_enabled === false) {
    notes.push('线上版为纯云端模式：本地小模型跑在我自己的机器上，云端容器没有 GPU。'
             + '路由、缓存、记忆、记账逻辑与本地版一致，只是"简单请求"由云端代答。');
  }
  if (q) notes.push(`今日演示额度 ${q.used}/${q.limit} 次`);

  $('drawer-body').innerHTML = `
    ${notes.length ? `<div class="note">${esc(notes.join(' · '))}</div>` : ''}

    <div class="sec-t">全站累计（含所有访客）</div>
    <div class="grid2">
      ${kv('请求数', s.runs || 0)}
      ${kv('累计成本', money(s.cost_cny, 4))}
      ${kv('较全云端节省', saved + '%')}
      ${kv('平均延迟', (s.avg_latency_ms || 0) + 'ms')}
      ${kv('缓存命中', (s.cache_hits || 0) + ' 次', s.cache_hit_ratio ? `${(s.cache_hit_ratio * 100).toFixed(0)}%` : '')}
      ${kv('门卫拦截', s.guard_blocks || 0, '次')}
      ${kv('动手的请求', s.tool_runs || 0, '轮')}
      ${kv('工具调用', s.tool_steps_total || 0, '步')}
    </div>

    <div class="sec-t">工具（Agent 能做的动作）</div>
    <div class="grid2">
      ${(window.__tools && window.__tools.tools ? window.__tools.tools : []).map((x) =>
        kv(esc(x.name),
           x.allowed === false ? '本轮不可用' : (x.level === 'danger' ? '危险级' : x.level === 'write' ? '会改状态' : '只读'),
           x.allowed === false ? esc(x.level + ' 级，权限已关')
             : (x.description ? esc(x.description.slice(0, 26)) : ''))).join('')
        || kv('工具', '未启用')}
    </div>
    <div class="note">循环上限 ${(window.__tools && window.__tools.max_steps) || '—'} 步 ·
      单次预算 ¥${(window.__tools && window.__tools.budget_cny) || '—'} ·
      结果超 ${(window.__tools && window.__tools.result_chars) || '—'} 字自动截断 ·
      本轮放行 ${(window.__tools && window.__tools.levels || []).join('/') || '—'}</div>
    <div class="note">外部工具服务（MCP）：${
      window.__tools && window.__tools.mcp && window.__tools.mcp.count
        ? window.__tools.mcp.count + ' 个服务 / ' + window.__tools.mcp.tools + ' 个工具（'
          + (window.__tools.mcp.servers || []).map((s) => esc(s.name) + ' ' + (s.connected ? '已连接' : '未连接')).join('，') + '）'
        : '未配置（只用手写工具）'}</div>
    <div class="note">人在环路：${
      window.__tools && window.__tools.confirm_enabled
        ? '开 · ' + ((window.__tools.confirm_levels || []).join('/') || '—') + ' 级工具动手前要你点头'
        : '关 · 工具一口气跑完（ENABLE_TOOL_GRAPH=0 的基线模式）'}</div>

    <div class="sec-t">多智能体审查</div>
    <div class="grid2">
      ${kv('审查员', (window.__tools && window.__tools.critic && window.__tools.critic.enabled) ? '开启' : '关闭',
           (window.__tools && window.__tools.critic && window.__tools.critic.enabled)
             ? '审 ' + (window.__tools.critic.when === 'all' ? '全部轮次' : '动过手的轮次') : 'ENABLE_CRITIC=1 打开')}
      ${kv('最多返工', ((window.__tools && window.__tools.critic && window.__tools.critic.max_rounds) || 0) + ' 次')}
      ${kv('及格线', ((window.__tools && window.__tools.critic && window.__tools.critic.min_score) || 0) + ' 分')}
      ${kv('审过的轮次', (s.critic_reviewed || 0) + ' 轮')}
      ${kv('被打回', (s.critic_failed || 0) + ' 轮')}
      ${kv('真改了', (s.critic_fixed || 0) + ' 轮')}
    </div>
    <div class="note">审查分两层：先做数字核对（零成本，答案里的数字必须能在证据里找到），
      再由模型审"有没有依据、有没有答非所问"。没过审查的答案不写缓存——
      否则这个错误会被复制到后面所有相似问题上。</div>

    <div class="sec-t">语义缓存</div>
    <div class="grid2">
      ${kv('缓存条目', c.entries != null ? c.entries : '—')}
      ${kv('复用相似度线', c.threshold != null ? Number(c.threshold).toFixed(2) : '—')}
      ${kv('向量后端', esc(c.embedder || '—'))}
      ${kv('门卫', c.guard ? '开启' : '关闭')}
      ${kv('命中省下', money(c.cost_saved_cny || 0, 4))}
      ${kv('知识库版本', kb.chunks ? esc(String(c.kb_version || '—')).slice(0, 20) : '未建索引')}
    </div>

    <div class="sec-t">知识库（RAG）</div>
    <div class="grid2">
      ${kv('文档', (kb.docs != null ? kb.docs : '—') + ' 篇')}
      ${kv('切块', (kb.chunks != null ? kb.chunks : '—') + ' 块')}
    </div>

    <div class="sec-t">本地模型熔断</div>
    <div class="grid2">
      ${kv('状态', esc(breakerText(d.local_breaker)))}
      ${kv('连续失败', (d.local_breaker && d.local_breaker.fails) || 0)}
    </div>

    <div class="sec-t">本对话的请求明细</div>
    ${recent.length ? `<table>
      <thead><tr><th>时间</th><th>问题</th><th>路由</th><th>耗时</th><th>成本</th></tr></thead>
      <tbody>${recent.map((x) => `
        <tr>
          <td>${esc((x.ts || '').slice(11))}</td>
          <td>${esc((x.query || '').slice(0, 16))}${x.guard_blocked ? ' <span class="gd">已拦</span>' : ''}</td>
          <td>${x.decided_by === 'cache' ? '缓存' : esc(x.route)}</td>
          <td>${x.latency_ms}ms</td>
          <td>${x.decided_by === 'cache' ? '¥0' : money(x.cost_cny)}</td>
        </tr>`).join('')}</tbody></table>`
      : '<div style="font-size:12px;color:#9b978d">这个对话还没有请求</div>'}
  `;
}

$('open-stats').onclick = async () => {
  openDrawer();
  await refreshGlobal();
};
function openDrawer() { $('drawer').classList.add('on'); $('scrim').classList.add('on'); }
function closeDrawer() { $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); }
$('close-drawer').onclick = closeDrawer;
$('scrim').onclick = () => { closeDrawer(); closeSide(); };

// 移动端侧栏
function closeSide() { $('side').classList.remove('on'); $('scrim').classList.remove('on'); }
$('menu').onclick = () => { $('side').classList.add('on'); $('scrim').classList.add('on'); };

// ---------------- 清空类操作（页面内二次确认，嵌入式预览会拦掉 confirm 弹窗） ----------------
function armed(btn, label, onConfirm) {
  if (btn.dataset.arm !== '1') {
    btn.dataset.arm = '1';
    btn.dataset.label = btn.textContent;
    btn.textContent = label;
    btn.classList.add('danger');
    setTimeout(() => {
      if (btn.dataset.arm === '1') {
        btn.dataset.arm = '0';
        btn.textContent = btn.dataset.label;
        btn.classList.remove('danger');
      }
    }, 3000);
    return;
  }
  btn.dataset.arm = '0';
  btn.textContent = btn.dataset.label;
  btn.classList.remove('danger');
  onConfirm();
}

$('clear-sessions').onclick = (e) => armed(e.target, '再点一次确认', async () => {
  try {
    const r = await fetch('/api/sessions', { method: 'DELETE' });
    const d = await r.json();
    mySids = [];
    localStorage.setItem(SIDS_KEY, '[]');
    startNewSession();
    setHint(`已清空 ${d.deleted} 个对话`);
  } catch (err) { setHint('清空失败：' + err, true); }
});

$('clear-stats').onclick = (e) => armed(e.target, '再点一次确认', async () => {
  try {
    const r = await fetch('/api/clear', { method: 'POST' });
    const d = await r.json();
    setHint(`已清空 ${d.deleted} 条记账`);
    refreshGlobal();
  } catch (err) { setHint('清空失败：' + err, true); }
});

$('forget').onclick = (e) => armed(e.target, '确认忘掉？', async () => {
  try {
    const r = await fetch('/api/memory/' + encodeURIComponent(userId), { method: 'DELETE' });
    const d = await r.json();
    setHint(`已忘掉 ${d.deleted} 条长期记忆（对话本身还在）`);
  } catch (err) { setHint('操作失败：' + err, true); }
});

// ---------------- 入口 ----------------
document.querySelectorAll('.chip[data-q]').forEach((b) => {
  b.onclick = () => { $('q').value = b.dataset.q; autoGrow(); $('q').focus(); };
});
document.querySelectorAll('.dcard').forEach((b) => {
  b.onclick = () => { $('q').value = b.dataset.q || b.querySelector('.q').textContent; send(); };
});

$('send').onclick = send;
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

(async function boot() {
  await loadSessions();
  // 先拿阈值/缓存配置：历史消息里的"门卫拦截"要写出"比 0.35 的复用线还高"，
  // 这个数得先到，否则第一屏会出现"相似度 0.906 已超过复用线"这种含糊表述。
  await refreshGlobal();
  await loadCurrent();
  if (new URLSearchParams(location.search).get('panel') === '1') openDrawer();
})();
</script>
